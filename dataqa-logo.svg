<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="markGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a6e6e"/>
      <stop offset="100%" stop-color="#0d1f3c"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a8f0e8"/>
    </linearGradient>
  </defs>

  <!-- Mark background: rounded square -->
  <rect x="0" y="8" width="64" height="64" rx="14" fill="url(#markGrad)"/>

  <!-- Outer diamond ring -->
  <path d="M32 16 L52 32 L32 48 L12 32 Z" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" fill="none"/>

  <!-- Inner diamond -->
  <path d="M32 22 L46 32 L32 42 L18 32 Z" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>

  <!-- Checkmark inside diamond -->
  <path d="M24 32 L29.5 38 L41 25" stroke="url(#checkGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Corner accent dots -->
  <circle cx="32" cy="16" r="2" fill="rgba(255,255,255,0.5)"/>
  <circle cx="52" cy="32" r="2" fill="rgba(255,255,255,0.5)"/>
  <circle cx="32" cy="48" r="2" fill="rgba(255,255,255,0.5)"/>
  <circle cx="12" cy="32" r="2" fill="rgba(255,255,255,0.5)"/>

  <!-- Wordmark -->
  <!-- "Data" -->
  <text x="80" y="38" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="26" font-weight="700" fill="#0d1f3c" letter-spacing="-0.5">Data</text>
  <!-- "QA" in teal -->
  <text x="155" y="38" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="26" font-weight="700" fill="#1a6e6e" letter-spacing="-0.5">QA</text>

  <!-- Tagline -->
  <text x="81" y="54" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9" font-weight="400" fill="#8896ab" letter-spacing="2">DATA QUALITY · SIMPLIFIED</text>
</svg>
